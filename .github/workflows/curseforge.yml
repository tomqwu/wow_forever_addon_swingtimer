name: Publish Forever Utilities to CurseForge
on:
  workflow_call:
    inputs:
      tag:
        required: true
        type: string
    secrets:
      CURSE_FORGE:
        required: true
  workflow_dispatch:
    inputs:
      tag:
        description: Existing GitHub release tag (e.g. ForeverUtilities-v0.1.1)
        required: true
        type: string
      dry_run:
        description: Validate the ZIP and CurseForge game version without uploading
        type: boolean
        default: true
permissions:
  contents: write
concurrency:
  group: curseforge-${{ inputs.tag }}
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Test publisher
        run: python3 -m unittest discover -s tests -p 'test_curseforge.py'
      - name: Upload release ZIP
        env:
          GH_TOKEN: ${{ github.token }}
          CURSE_FORGE: ${{ secrets.CURSE_FORGE }}
          CURSEFORGE_PROJECT_ID: ${{ vars.CURSEFORGE_PROJECT_ID }}
          RELEASE_TAG: ${{ inputs.tag }}
          DRY_RUN: ${{ inputs.dry_run || false }}
        run: |
          if [ "$DRY_RUN" = "true" ]; then
            python3 scripts/curseforge.py --tag "$RELEASE_TAG" --dry-run
          else
            python3 scripts/curseforge.py --tag "$RELEASE_TAG"
          fi
